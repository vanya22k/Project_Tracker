<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#F3F4F9;--surface:#FFFFFF;--surface-alt:#F7F8FB;--border:#E2E4EC;
  --ink:#1E2233;--ink-soft:#5B6072;--ink-faint:#9498A8;
  --primary:#4F5FE0;--primary-dark:#3F4DC4;--primary-soft:#EBEDFB;
  --warm:#C98A2E;--warm-dark:#A9701E;--warm-soft:#F7EDDC;
  --green:#1E8E5A;--green-soft:#E4F3EC;
  --amber:#B97A1D;--amber-soft:#F6ECDA;
  --red:#C4432E;--red-soft:#FAE8E4;
  --shadow-sm:0 1px 2px rgba(30,34,51,0.05);
  --shadow-md:0 4px 16px rgba(30,34,51,0.07);
  --shadow-lg:0 16px 40px rgba(30,34,51,0.14);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --font-display:'Fraunces',serif;--font-body:'Manrope',sans-serif;--font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);font-family:var(--font-body);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--warm-soft);}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:0.18;z-index:0;pointer-events:none;}
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;
  padding:14px 28px;background:rgba(238,241,252,0.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;display:flex;align-items:center;gap:6px;}

/* ── Cumin mark (shared SVG use) ── */
.cumin-mark{width:26px;height:26px;flex-shrink:0;overflow:visible;transition:transform .25s;}
.cumin-mark:hover{animation:cuminWiggle .6s ease;}
.auth-wordmark .cumin-mark{width:34px;height:34px;}
.cumin-mark .seed{opacity:0;transform-box:fill-box;transform-origin:center;animation:seedJourney 1.3s cubic-bezier(.4,1.1,.4,1) forwards;}
.cumin-mark .stem{fill:none;stroke:#1E8E5A;stroke-width:4;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110;animation:growStem .4s ease forwards;animation-delay:1.3s;}
.cumin-mark .leaf{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);animation:leafPop .3s cubic-bezier(.34,1.56,.64,1) forwards;}
.cumin-mark .pod{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);animation:podPop .32s cubic-bezier(.34,1.7,.64,1) forwards;}
@keyframes seedJourney{0%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.3);}30%{opacity:1;transform:translate(0,0) scale(1);}60%{opacity:1;}100%{opacity:1;transform:translate(var(--bx),var(--by)) scale(.8);}}
@keyframes growStem{to{stroke-dashoffset:0;}}
@keyframes leafPop{to{opacity:1;transform:scale(1);}}
@keyframes podPop{to{opacity:1;transform:scale(1);}}
@keyframes cuminWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}

.topbar-spacer{flex:1;}
.search-wrap{position:relative;width:280px;max-width:40vw;}
.search-input{width:100%;padding:9px 14px 9px 36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;outline:none;transition:box-shadow .15s;}
.search-input:focus{box-shadow:0 0 0 3px var(--primary-soft);border-color:var(--primary);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);max-height:320px;overflow-y:auto;z-index:50;}
.search-result-item{padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--border);cursor:pointer;}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(--surface-alt);}
.search-result-type{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-family:var(--font-mono);}

.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;transition:transform .12s,box-shadow .12s;}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--font-mono);}

.avatar-chip{width:38px;height:38px;border-radius:50%;background:var(--warm-soft);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);}
.user-menu-wrap{position:relative;}
.user-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);min-width:180px;overflow:hidden;z-index:50;}
.user-menu button{display:block;width:100%;text-align:left;padding:11px 14px;border:none;background:none;font-size:13.5px;}
.user-menu button:hover{background:var(--surface-alt);}

.notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);width:340px;max-height:400px;overflow-y:auto;z-index:50;}
.notif-header{padding:14px 16px;font-weight:700;font-size:13px;border-bottom:1px solid var(--border);}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer;}
.notif-item:hover{background:var(--surface-alt);}
.notif-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.notif-empty{padding:28px 16px;text-align:center;color:var(--ink-faint);font-size:13px;}

.container{max-width:1180px;margin:0 auto;padding:28px;}

/* ── Auth ── */
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.auth-card{position:relative;z-index:1;background:var(--surface);border-radius:var(--radius-lg);padding:44px 40px;width:380px;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
.auth-wordmark{font-family:var(--font-display);font-size:25px;font-weight:600;margin:0 0 4px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.auth-sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:14.5px;outline:none;background:var(--surface-alt);transition:border-color .15s,background .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:var(--surface);}
.field textarea{resize:vertical;min-height:70px;}
.password-wrap{position:relative;}
.password-wrap input{padding-right:42px;}
.password-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;width:32px;height:32px;border-radius:8px;font-size:15px;opacity:.55;display:flex;align-items:center;justify-content:center;}
.password-eye:hover{opacity:1;background:var(--surface-alt);}

.btn{border:none;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14px;transition:transform .12s,box-shadow .12s,opacity .12s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-warm{background:var(--warm);color:#3D2600;}
.btn-warm:hover{background:var(--warm-dark);}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--border);}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-danger:hover{opacity:.8;}
.btn-block{width:100%;}
.btn-sm{padding:6px 14px;font-size:12.5px;}
.link-btn{background:none;border:none;color:var(--primary);font-weight:700;font-size:13px;padding:0;}
.error-msg{background:var(--red-soft);color:var(--red);padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;font-weight:600;}
.success-msg{background:var(--green-soft);color:var(--green);padding:10px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;font-weight:600;}

/* ── Home ── */
.greeting-banner{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warm);border-radius:var(--radius-lg);padding:26px 30px;margin-bottom:22px;position:relative;overflow:hidden;}
.greeting-banner h1{font-family:var(--font-display);font-size:25px;font-weight:600;margin:0 0 4px;color:var(--ink);}
.greeting-banner p{margin:0;color:var(--ink-soft);font-size:13.5px;font-weight:500;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px;}
.stat-card{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;}
.stat-num{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--ink);}
.stat-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.section-title{font-family:var(--font-display);font-size:17px;font-weight:600;margin:28px 0 14px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;}
.section-title span.count{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);font-weight:500;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip{padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:var(--surface);color:var(--ink-soft);transition:all .12s;}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.chip:hover:not(.active){border-color:var(--primary);color:var(--primary);}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.team-card{background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.team-card:hover{box-shadow:var(--shadow-md);border-color:var(--ink-faint);}
.team-card-roof{height:3px;opacity:0.6;}
.team-card-body{padding:16px 18px;}
.team-card-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:10px;background:var(--surface-alt);border:1px solid var(--border);}
.team-card-name{font-weight:700;font-size:14.5px;margin-bottom:10px;color:var(--ink);}
.team-card-stats{display:flex;gap:12px;}
.tcs-item{text-align:left;}
.tcs-num{font-family:var(--font-mono);font-weight:600;font-size:15px;}
.tcs-label{font-size:9.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;font-weight:700;}

.summary-table-wrap{background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:12px 14px;background:var(--surface-alt);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:800;border-bottom:1px solid var(--border);}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-family:var(--font-mono);}
td.name-cell{font-family:var(--font-body);font-weight:700;}
tr:last-child td{border-bottom:none;}
tr.total-row td{font-weight:800;background:var(--surface-alt);}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(36,28,59,0.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
.modal{background:var(--surface);border-radius:var(--radius-lg);width:480px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-header{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-header h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
.modal-close{background:none;border:none;font-size:20px;color:var(--ink-faint);width:30px;height:30px;border-radius:50%;}
.modal-close:hover{background:var(--surface-alt);}
.modal-body{padding:22px 26px;}
.modal-footer{padding:18px 26px 24px;display:flex;gap:10px;justify-content:flex-end;}
.type-picker{display:flex;flex-direction:column;gap:10px;}
.type-picker button{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius-md);border:1.5px solid var(--border);background:var(--surface-alt);text-align:left;font-weight:700;font-size:14.5px;transition:border-color .12s,background .12s;}
.type-picker button:hover{border-color:var(--primary);background:var(--primary-soft);}
.type-picker .tp-icon{font-size:22px;}
.type-picker .tp-sub{font-size:12px;font-weight:500;color:var(--ink-soft);display:block;margin-top:2px;}

/* ── Workspace ── */
.workspace-header{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:22px;border:1px solid var(--border);flex-wrap:wrap;}
.ws-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--surface-alt);border:1px solid var(--border);}
.ws-name{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0;color:var(--ink);}
.ws-meta{color:var(--ink-soft);font-size:13px;margin-top:2px;}
.ws-spacer{flex:1;}
.back-link{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-soft);background:none;border:none;margin-bottom:14px;}
.back-link:hover{color:var(--primary);}
.tab-row{display:flex;gap:6px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;width:fit-content;}
.tab-btn{padding:8px 18px;border-radius:999px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--ink-soft);}
.tab-btn.active{background:var(--primary);color:#fff;}
.card-list{display:flex;flex-direction:column;gap:12px;}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 20px;}
.item-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;}
.item-title{font-weight:800;font-size:15px;}
.item-desc{color:var(--ink-soft);font-size:13.5px;line-height:1.5;margin:4px 0 12px;}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.pill-green{background:var(--green-soft);color:var(--green);}
.pill-amber{background:var(--amber-soft);color:var(--amber);}
.pill-red{background:var(--red-soft);color:var(--red);}
.pill-neutral{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border);}
.pill-priority-P0{background:var(--red-soft);color:var(--red);}
.pill-priority-P1{background:var(--amber-soft);color:var(--amber);}
.pill-priority-P2{background:var(--primary-soft);color:var(--primary);}

.meta-row{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0;font-size:12.5px;color:var(--ink-soft);}
.meta-item b{color:var(--ink);font-weight:700;}

.zonebar-wrap{margin:14px 0 6px;}
.zonebar{position:relative;height:8px;border-radius:999px;overflow:hidden;display:flex;background:var(--surface-alt);}
.zonebar div{height:100%;}
.zonebar .z-green{background:var(--green);}
.zonebar .z-amber{background:var(--amber);}
.zonebar .z-red{background:var(--red);}
.zonebar-marker{position:absolute;top:-2px;width:2px;height:12px;border-radius:1px;background:var(--ink);transform:translateX(-50%);}
.zonebar-label{font-size:11px;color:var(--ink-soft);margin-top:6px;font-family:var(--font-mono);font-weight:600;}

.stakeholder-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;}
.stakeholder-node{background:var(--primary-soft);color:var(--primary-dark);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;}
.stakeholder-arrow{color:var(--ink-faint);font-size:13px;}

.inline-edit-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;}
.inline-select,.inline-date{padding:6px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:12.5px;font-weight:700;background:var(--surface-alt);}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);background:var(--surface);border-radius:var(--radius-md);border:1px dashed var(--border);font-size:14px;}

.save-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:200;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;}
.save-toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.add-btn-wrap{position:relative;}
.mgmt-table-wrap{background:var(--surface);border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden;}

.week-summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.week-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;}
.week-stat-num{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--ink);}
.week-stat-label{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px 22px;}
.chart-card h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0 0 16px;color:var(--ink);}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:120px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-track{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;}
.bar-fill{width:60%;background:var(--primary);border-radius:3px 3px 0 0;min-height:2px;transition:height .3s;}
.bar-day-label{font-size:10.5px;color:var(--ink-soft);font-weight:700;}
.bar-value{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}

.checkin-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.checkin-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
.checkin-label{font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.checkin-row.logged .checkin-label{color:var(--green);}
.checkin-note{font-size:12px;color:var(--ink-faint);margin-top:4px;font-style:italic;}
.role-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;}
.role-Admin{background:var(--warm-soft);color:var(--warm-dark);}
.role-User{background:var(--surface-alt);color:var(--ink-soft);}
.status-Active{color:var(--green);font-weight:700;}
.status-Inactive{color:var(--ink-faint);font-weight:700;}

@media(max-width:640px){
  .stat-row,.week-summary-row{grid-template-columns:repeat(2,1fr);}
  .container{padding:16px;}
  .search-wrap{display:none;}
  .tab-row{flex-wrap:wrap;width:100%;border-radius:var(--radius-md);}
  .workspace-header{padding:16px 18px;}
  .add-btn-wrap,.add-btn-wrap .btn-primary{width:100%;}
}
</style>
</head>
<body>
<div id="app">

  <!-- AUTH -->
  <div id="authScreen">
    <div class="blob" style="width:420px;height:420px;background:var(--warm);top:-140px;left:-120px;"></div>
    <div class="blob" style="width:360px;height:360px;background:var(--primary);bottom:-140px;right:-100px;"></div>
    <div class="auth-card">
      <p class="auth-wordmark">
        <!-- Single <use> reference — no inline SVG duplication -->
        <svg class="cumin-mark" xmlns="http://www.w3.org/2000/svg"><use href="#cumin-mark-sym"/></svg>
        Cumin
      </p>
      <p class="auth-sub" id="authSubtitle">One place for everyone's best work.</p>
      <div id="authError" class="error-msg hidden"></div>
      <div id="authSuccess" class="success-msg hidden"></div>

      <div id="loginForm">
        <div class="field"><label>Work Email</label><input type="email" id="loginEmail" placeholder="you@company.com"></div>
        <div class="field">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" placeholder="6-digit password">
            <button type="button" class="password-eye" data-toggle-pw="loginPassword" aria-label="Show password">👁</button>
          </div>
        </div>
        <button class="btn btn-warm btn-block" id="loginBtn">Log in</button>
        <div style="text-align:center;margin-top:16px;"><button class="link-btn" id="showForgotBtn">Forgot password?</button></div>
      </div>

      <div id="forgotForm" class="hidden">
        <div class="field"><label>Work Email</label><input type="email" id="forgotEmail" placeholder="you@company.com"></div>
        <button class="btn btn-warm btn-block" id="forgotBtn">Send new password</button>
        <div style="text-align:center;margin-top:16px;"><button class="link-btn" id="backToLoginBtn">Back to login</button></div>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp" class="hidden">
    <div class="topbar">
      <div class="wordmark">
        <svg class="cumin-mark" xmlns="http://www.w3.org/2000/svg"><use href="#cumin-mark-sym"/></svg>
        Cumin
      </div>
      <div class="topbar-spacer"></div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="Search projects, people, ideas…">
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <div style="position:relative;">
        <button class="icon-btn" id="notifBtn">🔔<span id="notifBadge" class="badge hidden">0</span></button>
        <div id="notifDropdown" class="notif-dropdown hidden"></div>
      </div>
      <div class="user-menu-wrap">
        <button class="icon-btn" id="avatarBtn" style="border-radius:50%;padding:0;overflow:hidden;">
          <span id="topbarAvatar">🙂</span>
        </button>
        <div id="userMenu" class="user-menu hidden">
          <button data-action="goHome">🏠 Home</button>
          <button data-action="openTeamManagement" id="teamMgmtMenuBtn" class="hidden">👑 Team Management</button>
          <button data-action="resetOwnPw">🔑 Reset my password</button>
          <button data-action="logout">🚪 Log out</button>
        </div>
      </div>
    </div>
    <div class="container" id="mainContainer"></div>
  </div>
</div>

<div id="toast" class="save-toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbySzb8o3apNUO7Mxkb_2TGtmrAp2tBrzTR9uUHBjLQq_00WYrI3A6Iv4zix6f73zMkw/exec';

const PROJECT_STATUSES = ['Open','In Progress','On Hold','Delayed','Completed'];
const IDEA_TYPES       = ['Visibility','Cost','Process Improvement','CX'];
const PRIORITIES       = ['P0','P1','P2'];
const UPDATE_TYPES     = ['Update Progress','Update Delay','Update Deprioritization'];

const AVATAR_COLORS = {
  '🦊':'#FF8A4C','🐼':'#5B6B79','🐸':'#2FAE6B','🐯':'#FFA53E','🐨':'#8E9AAF',
  '🐙':'#8E5CD9','🦄':'#F06BB0','🐻':'#8B5E3C','🐱':'#FF7A6B','🐰':'#FF9AC8',
  '🦋':'#5A8DEE','🐥':'#FFD23F'
};

const JUNK_ANSWERS = new Set(['na','n/a','not applicable','none','nil','-','nothing','xyz','test','asdf','tbd','pending','ok','done','...','.',  'abc','idk']);

/* ============================================================
   STATE  — single source of truth, never mutate directly
   ============================================================ */
const state = {
  token: localStorage.getItem('townhall_token') || null,
  user:  JSON.parse(localStorage.getItem('townhall_user') || 'null'),
  homeFilter: 'All',
  currentWorkspaceUserId: null,
  currentWorkspaceTab: 'projects',
  workspaceData: null,
  _searchTimer: null,
};

/* ============================================================
   API — single fetch helper, text/plain avoids CORS preflight
   ============================================================ */
async function apiCall(action, payload = {}) {
  const body = { action, ...payload };
  if (action !== 'login' && action !== 'forgotPassword') body.token = state.token;

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      throw new Error('Server returned HTTP ' + res.status);
    }

    return await res.json();
  } catch (err) {
    return {
      ok: false,
      error: err && err.message
        ? err.message
        : 'Unable to connect to the Cumin server.'
    };
  }
}) {
  payload.action = action;
  if (state.token) payload.token = state.token;
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return await r.json();
  } catch (e) {
    return { ok: false, error: `Network error (${e.message || 'unknown'}) — check your connection.` };
  }
}

/* ============================================================
   TOAST
   ============================================================ */
let _toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ============================================================
   DOM HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
function setHidden(id, hidden) { $(id).classList.toggle('hidden', hidden); }
function setHTML(id, html) { $(id).innerHTML = html; }

/* ============================================================
   UTILS
   ============================================================ */
const _ESC = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' };
function escapeHtml(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, m => _ESC[m]); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function val(id) { return $(id).value.trim(); }

function formatDateInput(v) {
  if (!v) return '';
  const d = new Date(v);
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
function formatDateDisplay(v) {
  if (!v) return '—';
  const d = new Date(v);
  return isNaN(d) ? '—' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function formatDateTimeDisplay(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })
    + ' — ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}
function isJunkDescription(text) {
  const n = String(text).trim().toLowerCase().replace(/[.\-_!]+$/, '');
  return n.length < 8 || JUNK_ANSWERS.has(n);
}

/* ============================================================
   EVENT DELEGATION — replaces ~50 inline onclick attributes
   ============================================================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (btn) {
    const act = btn.dataset.action;
    if (act === 'goHome')             { closeUserMenu(); goHome(); }
    else if (act === 'openTeamManagement') { closeUserMenu(); openTeamManagement(); }
    else if (act === 'resetOwnPw')   { closeUserMenu(); showResetOwnPassword(); }
    else if (act === 'logout')        { doLogout(); }
  }

  // Password toggle
  const pwToggle = e.target.closest('[data-toggle-pw]');
  if (pwToggle) togglePasswordVisibility(pwToggle.dataset.togglePw, pwToggle);

  // Close dropdowns when clicking outside
  if (!e.target.closest('.search-wrap'))     setHidden('searchResults', true);
  if (!e.target.closest('.user-menu-wrap'))  setHidden('userMenu', true);
  if (!e.target.closest('#notifBtn') && !e.target.closest('#notifDropdown')) setHidden('notifDropdown', true);
  if (!e.target.closest('.add-btn-wrap')) {
    const dd = $('addPickerDropdown');
    if (dd) dd.classList.add('hidden');
  }
});

/* ============================================================
   AUTH
   ============================================================ */
function showLogin() {
  setHidden('loginForm', false); setHidden('forgotForm', true);
  $('authSubtitle').textContent = "One place for everyone's best work.";
  hideAuthMsgs();
}
function showForgot() {
  setHidden('loginForm', true); setHidden('forgotForm', false);
  $('authSubtitle').textContent = "We'll email you a new password.";
  hideAuthMsgs();
}
function hideAuthMsgs() { setHidden('authError', true); setHidden('authSuccess', true); }
function authError(msg)   { $('authError').textContent = msg; setHidden('authError', false); setHidden('authSuccess', true); }
function authSuccess(msg) { $('authSuccess').textContent = msg; setHidden('authSuccess', false); setHidden('authError', true); }

$('loginBtn').onclick = doLogin;
$('forgotBtn').onclick = doForgotPassword;
$('showForgotBtn').onclick = showForgot;
$('backToLoginBtn').onclick = showLogin;

async function doLogin() {
  const email = $('loginEmail').value.trim();
  const password = $('loginPassword').value.trim();
  if (!email || !password) return authError('Enter your email and password.');
  const res = await apiCall('login', { email, password });
  if (!res.ok) return authError(res.error);
  state.token = res.data.token;
  state.user  = res.data.user;
  localStorage.setItem('townhall_token', state.token);
  localStorage.setItem('townhall_user', JSON.stringify(state.user));
  enterApp();
}

async function doForgotPassword() {
  const email = $('forgotEmail').value.trim();
  if (!email) return authError('Enter your email.');
  const res = await apiCall('forgotPassword', { email });
  if (!res.ok) return authError(res.error);
  authSuccess(res.data.message);
}

async function doLogout() {
  await apiCall('logout');
  localStorage.removeItem('townhall_token');
  localStorage.removeItem('townhall_user');
  state.token = null; state.user = null;
  setHidden('mainApp', true); setHidden('authScreen', false);
  showLogin();
}

function showResetOwnPassword() {
  if (!confirm('Send a new password to ' + state.user.email + '?')) return;
  apiCall('forgotPassword', { email: state.user.email }).then(res =>
    showToast(res.ok ? 'New password sent to your email.' : res.error || 'Something went wrong.')
  );
}

/* ============================================================
   ENTER APP — single path used by both login and auto-restore
   ============================================================ */
let homeDataCache = null;
let homeSummaryCache = null;
let notifCache = [];

async function enterApp() {
  setHidden('authScreen', true); setHidden('mainApp', false);
  $('topbarAvatar').textContent = state.user.avatar;
  setHidden('teamMgmtMenuBtn', state.user.role !== 'Admin');
  state.currentWorkspaceUserId = null;
  renderLoading();

  const res = await apiCall('getHomeBundle');
  if (!res.ok || !res.data?.home) { renderError(res.error || 'Could not load homepage.'); return; }

  homeDataCache  = res.data.home;
  homeSummaryCache = res.data.summary;
  applyNotifications(res.data.notifications);
  renderHome(homeDataCache, homeSummaryCache);
  if (res.data.notifications) showDefaulterPopupIfNeeded(res.data.notifications.alerts);
}

function applyNotifications(data) {
  if (!data) return;
  notifCache = data.alerts;
  const badge = $('notifBadge');
  badge.textContent = data.count;
  setHidden('notifBadge', data.count === 0);
}

if (state.token && state.user) enterApp();

/* ============================================================
   TOPBAR — notifications, user menu, search
   ============================================================ */
function closeUserMenu() { setHidden('userMenu', true); }

$('avatarBtn').onclick = () => {
  const menu = $('userMenu');
  menu.classList.toggle('hidden');
  setHidden('notifDropdown', true);
};

$('notifBtn').onclick = async () => {
  const el = $('notifDropdown');
  setHidden('userMenu', true);
  if (!el.classList.contains('hidden')) { setHidden('notifDropdown', true); return; }
  setHidden('notifDropdown', false);
  renderNotifDropdown();         // show cached instantly
  const res = await apiCall('getNotifications');
  if (res.ok) applyNotifications(res.data);
  renderNotifDropdown();         // refresh with latest
};

function renderNotifDropdown() {
  const colorFor = { overdue:'var(--red)', dueToday:'var(--amber)', dueTomorrow:'#FFD23F' };
  let html = '<div class="notif-header">Deadline Alerts</div>';
  if (!notifCache.length) {
    html += '<div class="notif-empty">✨ Nothing overdue. Clear skies.</div>';
  } else {
    notifCache.forEach(n => {
      html += `<div class="notif-item" data-ws-user="${escapeAttr(n.userId||'')}">
        <span class="notif-dot" style="background:${colorFor[n.level]}"></span>
        <span>${escapeHtml(n.avatar||'')} ${escapeHtml(n.message)}</span>
      </div>`;
    });
  }
  setHTML('notifDropdown', html);

  // Delegated click inside the dropdown
  $('notifDropdown').onclick = e => {
    const item = e.target.closest('.notif-item');
    if (item?.dataset.wsUser) {
      setHidden('notifDropdown', true);
      openWorkspace(item.dataset.wsUser);
    }
  };
}

function showDefaulterPopupIfNeeded(alerts) {
  if (state.user.role !== 'Admin' || !alerts) return;
  const overdue = alerts.filter(a => a.level === 'overdue');
  if (!overdue.length) return;
  const list = overdue.map(o => `<li style="margin-bottom:6px;"><b>${escapeHtml(o.ownerName)}</b> — ${escapeHtml(o.projectName)}</li>`).join('');
  openModal(`
    <div class="modal-header"><h2>⚠️ Deadline Report</h2><button class="modal-close" id="_mc">✕</button></div>
    <div class="modal-body">
      <p style="color:var(--ink-soft);font-size:13.5px;line-height:1.6;">
        The following team member${overdue.length>1?'s have':' has'} exceeded their committed ETD:
      </p>
      <ul style="font-size:13.5px;padding-left:20px;">${list}</ul>
    </div>
    <div class="modal-footer"><button class="btn btn-primary" id="_mok">Acknowledge</button></div>
  `);
  $('_mc').onclick = $('_mok').onclick = closeModal;
}

/* Search */
$('searchInput').addEventListener('input', () => {
  clearTimeout(state._searchTimer);
  const q = $('searchInput').value.trim();
  if (!q) { setHidden('searchResults', true); return; }
  state._searchTimer = setTimeout(async () => {
    const res = await apiCall('search', { query: q });
    if (!res.ok) return;
    const results = res.data.results;
    if (!results.length) {
      setHTML('searchResults', '<div class="search-result-item" style="color:var(--ink-faint)">No matches.</div>');
    } else {
      setHTML('searchResults', results.map(r =>
        `<div class="search-result-item" data-ws-user="${escapeAttr(r.userId||'')}">
          <div class="search-result-type">${r.type}</div>
          <div>${escapeHtml(r.label)}</div>
        </div>`).join(''));
    }
    setHidden('searchResults', false);
    $('searchResults').onclick = e => {
      const item = e.target.closest('.search-result-item');
      if (!item) return;
      setHidden('searchResults', true);
      $('searchInput').value = '';
      if (item.dataset.wsUser) openWorkspace(item.dataset.wsUser);
    };
  }, 280);
});

/* ============================================================
   MODAL
   ============================================================ */
function openModal(html) {
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'activeOverlay';
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
  const modal = document.createElement('div');
  modal.className = 'modal'; modal.innerHTML = html;
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}
function closeModal() { $('activeOverlay')?.remove(); }

/* ============================================================
   HOME
   ============================================================ */
const GREETING_LINES = ["Here's what's on your plate today.","Let's make today count.","Everything's on the board — go get it.","Good things are in motion.","One good day builds the next."];

function renderLoading() { setHTML('mainContainer', '<div style="padding:80px;text-align:center;color:var(--ink-faint);">Loading Cumin…</div>'); }
function renderError(msg) { setHTML('mainContainer', `<div class="empty-state">⚠️ ${escapeHtml(msg)}</div>`); }

async function goHome() {
  state.currentWorkspaceUserId = null;
  renderLoading();
  const res = await apiCall('getHomeBundle');
  if (!res.ok || !res.data?.home) { renderError(res.error || 'Could not load homepage.'); return; }
  homeDataCache = res.data.home;
  homeSummaryCache = res.data.summary;
  applyNotifications(res.data.notifications);
  renderHome(homeDataCache, homeSummaryCache);
}

function renderHome(data, summary) {
  const hour = new Date().getHours();
  const timeGreet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const flair     = hour < 12 ? '🌻' : hour < 17 ? '☀️' : '🌙';
  const line      = GREETING_LINES[new Date().getDate() % GREETING_LINES.length];
  const ps = data.personalSummary;

  // Filter team cards
  let teamCards = data.teamCards;
  const f = state.homeFilter;
  if (f !== 'All') teamCards = teamCards.filter(t =>
    f === 'Ongoing'   ? t.ongoing > 0 :
    f === 'Completed' ? t.completed > 0 :
    f === 'Delayed'   ? t.ongoing > 0 :
    f === 'My Work'   ? t.userId === state.user.userId : true
  );

  const teamHtml = teamCards.map(t => {
    const color = AVATAR_COLORS[t.avatar] || 'var(--primary)';
    return `<div class="team-card" data-ws-user="${t.userId}">
      <div class="team-card-roof" style="background:${color}"></div>
      <div class="team-card-body">
        <div class="team-card-avatar">${t.avatar}</div>
        <div class="team-card-name">${escapeHtml(t.name)}</div>
        <div class="team-card-stats">
          <div class="tcs-item"><div class="tcs-num" style="color:var(--green)">${t.active}</div><div class="tcs-label">Active</div></div>
          <div class="tcs-item"><div class="tcs-num" style="color:var(--amber)">${t.ongoing}</div><div class="tcs-label">Ongoing</div></div>
          <div class="tcs-item"><div class="tcs-num" style="color:var(--primary)">${t.completed}</div><div class="tcs-label">Done</div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Summary table
  let summaryHtml = '';
  if (summary) {
    const rows = summary.rows.map(r => `
      <tr>
        <td class="name-cell">${r.avatar} ${escapeHtml(r.name)}</td>
        <td>${r.newCount}</td><td>${r.inProgress}</td><td>${r.completed}</td>
        <td>${r.ideas}</td><td>${r.adhoc}</td>
        <td style="color:${r.delayed > 0 ? 'var(--red)' : 'inherit'}">${r.delayed}</td>
      </tr>`).join('');
    summaryHtml = `
      <div class="section-title">📊 Today at Cumin</div>
      <div class="summary-table-wrap"><table>
        <thead><tr><th>Team Member</th><th>New</th><th>In Progress</th><th>Completed</th><th>Ideas</th><th>Ad-hoc</th><th>Delayed</th></tr></thead>
        <tbody>${rows}
          <tr class="total-row"><td>Total</td><td>${summary.totals.newCount}</td><td>${summary.totals.inProgress}</td>
            <td>${summary.totals.completed}</td><td>${summary.totals.ideas}</td><td>${summary.totals.adhoc}</td><td>${summary.totals.delayed}</td>
          </tr>
        </tbody>
      </table></div>`;
  }

  setHTML('mainContainer', `
    <div class="greeting-banner">
      <h1>${timeGreet}, ${escapeHtml(data.greetingName)} ${flair}</h1>
      <p>${line}</p>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-num">${ps.active}</div><div class="stat-label">Active Projects</div></div>
        <div class="stat-card"><div class="stat-num">${ps.completed}</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-num">${ps.ideas}</div><div class="stat-label">Ideas</div></div>
        <div class="stat-card"><div class="stat-num">${ps.adhocTimeToday}</div><div class="stat-label">Ad-hoc Today</div></div>
      </div>
    </div>
    <div class="section-title">👥 Your Team <span class="count">${teamCards.length} of ${data.teamCards.length}</span></div>
    <div class="chip-row">
      ${['All','My Work','Ongoing','Completed','Delayed'].map(lbl =>
        `<button class="chip${state.homeFilter === lbl ? ' active' : ''}" data-filter="${lbl}">${lbl}</button>`
      ).join('')}
    </div>
    <div class="team-grid" id="teamGrid">
      ${teamHtml || '<div class="empty-state">No one matches this filter right now.</div>'}
    </div>

    if (chip) { state.homeFilter = chip.dataset.filter; renderHome(homeDataCache, homeSummaryCache); }
  };
}

/* ============================================================
   WORKSPACE
   ============================================================ */
async function openWorkspace(userId) {
  if (!userId) return;
  setHidden('notifDropdown', true);
  state.currentWorkspaceUserId = userId;
  state.currentWorkspaceTab    = 'projects';
  renderLoading();
  const res = await apiCall('getUserWorkspace', { userId });
  if (!res.ok) { renderError(res.error); return; }
  state.workspaceData = res.data;
  renderWorkspace();
}

function renderWorkspace() {
  const d = state.workspaceData;
  const isMine = d.user.userId === state.user.userId;

  const tabs = [
    { id:'projects', label:`Projects (${d.projects.length})` },
    { id:'ideas',    label:`Ideas (${d.ideas.length})` },
  ];
  if (d.isSelfOrAdmin) {
    tabs.push({ id:'week',    label:'📊 This Week' });
    tabs.push({ id:'adhoc',   label:`Ad-hoc (${d.adhoc.length})` });
    tabs.push({ id:'history', label:'History' });
  }

  const addPicker = isMine ? `
    <div class="add-btn-wrap">
      <button class="btn btn-primary" id="addPickerToggleBtn">+ Add</button>
      <div id="addPickerDropdown" class="hidden" style="position:absolute;top:calc(100% + 8px);right:0;z-index:50;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:10px;">
        <div class="type-picker">
          <button id="openProjectModalBtn"><span class="tp-icon">📁</span><span>Project<span class="tp-sub">A formal piece of work with an ETD</span></span></button>
          <button id="openIdeaModalBtn"><span class="tp-icon">💡</span><span>Idea<span class="tp-sub">Something worth exploring later</span></span></button>
          <button id="openAdhocModalBtn"><span class="tp-icon">⚡</span><span>Ad-hoc<span class="tp-sub">Unplanned work you did today</span></span></button>
        </div>
      </div>
    </div>` : '';

  setHTML('mainContainer', `
    <button class="back-link" id="wsBackBtn">← Back to Cumin</button>
    <div class="workspace-header">
      <div class="ws-avatar">${d.user.avatar}</div>
      <div>
        <p class="ws-name">${escapeHtml(d.user.name)}'s Workspace</p>
        <p class="ws-meta">${escapeHtml(d.user.email)}${isMine ? ' · This is you' : ''}</p>
      </div>
      <div class="ws-spacer"></div>
      ${addPicker}
    </div>
    <div class="tab-row">
      ${tabs.map(t => `<button class="tab-btn${state.currentWorkspaceTab === t.id ? ' active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div id="workspaceTabContent"></div>
  `);

  $('wsBackBtn').onclick = goHome;

  if (isMine) {
    $('addPickerToggleBtn').onclick = e => { e.stopPropagation(); $('addPickerDropdown').classList.toggle('hidden'); };
    $('openProjectModalBtn').onclick = () => { $('addPickerDropdown').classList.add('hidden'); openProjectModal(); };
    $('openIdeaModalBtn').onclick    = () => { $('addPickerDropdown').classList.add('hidden'); openIdeaModal(); };
    $('openAdhocModalBtn').onclick   = () => { $('addPickerDropdown').classList.add('hidden'); openAdhocModal(); };
  }

  // Tab row delegation
  $('mainContainer').addEventListener('click', e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { state.currentWorkspaceTab = tab.dataset.tab; renderWorkspace(); }
  }, { once: true }); // remove after first use; renderWorkspace re-adds it

  renderWorkspaceTabContent();
}

function renderWorkspaceTabContent() {
  const d = state.workspaceData;
  const canEdit = d.user.userId === state.user.userId || state.user.role === 'Admin';
  const el = $('workspaceTabContent');

  if (state.currentWorkspaceTab === 'projects') {
    el.innerHTML = d.projects.length
      ? `<div class="card-list">${d.projects.map(p => renderProjectCard(p, canEdit)).join('')}</div>`
      : '<div class="empty-state">Nothing here yet — click + Add to start your first project.</div>';
    // Delegate project-card interactions
    el.onclick = e => {
      const projectId = e.target.closest('[data-project-id]')?.dataset.projectId;
      if (!projectId) return;
      if (e.target.closest('[data-edit-project]'))  return openEditProjectModal(projectId);
      if (e.target.closest('[data-log-project]'))   return openProjectLogPage(projectId);
      if (e.target.closest('[data-edit-checkin]'))  return openProjectCheckinEdit(projectId, e);
    };
    el.onchange = e => {
      const row = e.target.closest('[data-project-id]');
      if (!row) return;
      const pid = row.dataset.projectId;
      if (e.target.classList.contains('status-select')) updateProjectField(pid, 'status', e.target.value);
      if (e.target.classList.contains('eta-input'))     updateProjectField(pid, 'eta', e.target.value);
      if (e.target.type === 'checkbox' && e.target.classList.contains('checkin-cb')) {
        e.target.checked = !e.target.checked; // undo optimistic flip; handler controls state
        onCheckinToggle(pid, e.target);
      }
    };
  } else if (state.currentWorkspaceTab === 'ideas') {
    el.innerHTML = d.ideas.length
      ? `<div class="card-list">${d.ideas.map(i => renderIdeaCard(i, canEdit)).join('')}</div>`
      : '<div class="empty-state">No ideas logged yet — every good project starts with one.</div>';
  } else if (state.currentWorkspaceTab === 'adhoc') {
    el.innerHTML = d.adhoc.length
      ? `<div class="card-list">${d.adhoc.map(a => renderAdhocCard(a, canEdit)).join('')}</div>`
      : '<div class="empty-state">Nothing logged yet — you\'re all caught up.</div>';
  } else if (state.currentWorkspaceTab === 'history') {
    el.innerHTML = d.activityHistory.length
      ? `<div class="card-list">${d.activityHistory.map(renderHistoryItem).join('')}</div>`
      : '<div class="empty-state">No activity yet — this fills in as work happens.</div>';
  } else if (state.currentWorkspaceTab === 'week') {
    renderWeekTab(d.user.userId);
  }
}

async function renderWeekTab(userId) {
  const el = $('workspaceTabContent');
  el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-faint);">Loading weekly summary…</div>';
  const res = await apiCall('getWeeklySummary', { userId });
  if (!res.ok) { el.innerHTML = `<div class="empty-state">⚠️ ${escapeHtml(res.error)}</div>`; return; }
  const { days, totals } = res.data;
  const maxCheckIns = Math.max(1, ...days.map(d => d.checkIns));
  const maxHours    = Math.max(1, ...days.map(d => d.adhocHours));

  const barCols = (data, max, color) => data.map(d => `
    <div class="bar-col">
      <div class="bar-value">${d[0] || ''}</div>
      <div class="bar-track"><div class="bar-fill" style="height:${d[0] === 0 ? 2 : (d[0] / max * 100)}%;${color ? 'background:' + color + ';' : ''}"></div></div>
      <div class="bar-day-label">${d[1]}</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="week-summary-row">
      <div class="week-stat"><div class="week-stat-num">${totals.projectsTouched}</div><div class="week-stat-label">Projects Touched</div></div>
      <div class="week-stat"><div class="week-stat-num">${totals.totalHours}h</div><div class="week-stat-label">Hours Logged</div></div>
      <div class="week-stat"><div class="week-stat-num">${totals.ideasAdded}</div><div class="week-stat-label">Ideas Added</div></div>
      <div class="week-stat"><div class="week-stat-num">${totals.completed}</div><div class="week-stat-label">Completed</div></div>
    </div>
    <div class="chart-card" style="margin-bottom:14px;">
      <h3>Daily check-ins</h3>
      <div class="bar-chart">${barCols(days.map(d => [d.checkIns, d.label]), maxCheckIns, '')}</div>
    </div>
    <div class="chart-card">
      <h3>Ad-hoc hours logged</h3>
      <div class="bar-chart">${barCols(days.map(d => [d.adhocHours, d.label]), maxHours, 'var(--warm)')}</div>
    </div>`;
}

/* ============================================================
   PROJECT CARD
   ============================================================ */
function zoneColor(z) { return z === 'green' ? 'var(--green)' : z === 'amber' ? 'var(--amber)' : 'var(--red)'; }
function pillForStatus(s) {
  return s === 'Completed' ? 'pill-green' : s === 'Delayed' ? 'pill-red' : s === 'On Hold' ? 'pill-amber' : 'pill-neutral';
}

function renderZoneBar(p) {
  if (p.status === 'Completed') return `
    <div class="zonebar-wrap">
      <div class="zonebar"><div class="z-green" style="width:100%"></div></div>
      <div class="zonebar-label">${escapeHtml(p.completionVariance || 'Completed')}</div>
    </div>`;
  const markerPos = p.zone === 'green' ? 20 : p.zone === 'amber' ? 55 : 90;
  const label = p.displayStatus === 'Delayed'
    ? (p.daysRemaining < 0 ? `${Math.abs(p.daysRemaining)} day(s) overdue` : `⚠️ Flagged at risk — ${p.daysRemaining} day(s) left`)
    : `${p.daysRemaining} day(s) remaining`;
  return `<div class="zonebar-wrap">
    <div class="zonebar" style="position:relative;">
      <div class="z-green" style="width:33.3%"></div><div class="z-amber" style="width:33.3%"></div><div class="z-red" style="width:33.4%"></div>
      <div class="zonebar-marker" style="left:${markerPos}%;background:${zoneColor(p.zone)}"></div>
    </div>
    <div class="zonebar-label" style="color:${zoneColor(p.zone)}">${label}</div>
  </div>`;
}

function renderStakeholders(str) {
  if (!str) return '';
  const parts = String(str).split('→').map(s => s.trim()).filter(Boolean);
  return parts.length ? `<div class="stakeholder-chain">${parts.map((s,i) =>
    (i > 0 ? '<span class="stakeholder-arrow">→</span>' : '') +
    `<span class="stakeholder-node">${escapeHtml(s)}</span>`).join('')}</div>` : '';
}

function renderProjectCard(p, canEdit) {
  const isAdmin = state.user.role === 'Admin';
  const pid = p.projectId;
  const editControls = canEdit ? `
    <div class="inline-edit-row">
      <select class="inline-select status-select">
        ${PROJECT_STATUSES.map(s => `<option value="${s}"${p.status===s?' selected':''}>${s==='Open'?'Open / To Be Picked':s==='Delayed'?'Delayed (at risk)':s}</option>`).join('')}
      </select>
      ${isAdmin
        ? `<input type="date" class="inline-date eta-input" value="${formatDateInput(p.eta)}">`
        : `<span class="pill pill-neutral">🔒 ETD: ${formatDateDisplay(p.eta)}</span>`}
      ${p.status==='Completed' ? `<span class="pill pill-green">✓ Completed ${formatDateDisplay(p.actualCompletionDate)}</span>` : ''}
      <button class="btn btn-ghost btn-sm" data-edit-project="1">Edit details</button>
    </div>` : '';

  return `<div class="item-card" data-project-id="${pid}">
    <div class="item-card-top">
      <div class="item-title"${canEdit ? ' data-log-project="1" style="cursor:pointer;text-decoration:underline;text-decoration-color:transparent;transition:text-decoration-color .15s" onmouseover="this.style.textDecorationColor=\'var(--ink-faint)\'" onmouseout="this.style.textDecorationColor=\'transparent\'"' : ''}>${escapeHtml(p.projectName)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
        <span class="pill ${pillForStatus(p.displayStatus)}">${p.displayStatus}</span>
        <span class="pill pill-priority-${p.priority}">${p.priority}</span>
      </div>
    </div>
    <div class="item-desc">${escapeHtml(p.description||'')}</div>
    ${renderZoneBar(p)}
    <div class="meta-row">
      <div class="meta-item">ETD: <b>${formatDateDisplay(p.eta)}</b></div>
      ${p.impact ? `<div class="meta-item">Scope: <b>${escapeHtml(p.impact)}</b></div>` : ''}
      ${p.dependency ? `<div class="meta-item">Dependency: <b>${escapeHtml(p.dependency)}</b></div>` : ''}
    </div>
    ${renderStakeholders(p.stakeholders)}
    ${editControls}
    ${canEdit ? renderCheckinRow(p) : ''}
  </div>`;
}

function renderCheckinRow(p) {
  const logged = !!p.loggedToday;
  return `<div class="checkin-row${logged ? ' logged' : ''}">
    <input type="checkbox" class="checkin-cb" id="cb-${p.projectId}"${logged ? ' checked' : ''}>
    <label class="checkin-label" for="cb-${p.projectId}">${logged ? `✓ Logged: ${escapeHtml(p.todaysLogType||'')}` : 'I worked on this project today'}</label>
    ${logged ? `<button class="link-btn" data-edit-checkin="1" style="margin-left:auto;font-size:12px;">Edit</button>` : ''}
  </div>
  ${logged && p.todaysLogDescription ? `<div class="checkin-note">"${escapeHtml(p.todaysLogDescription)}"</div>` : ''}`;
}

/* ── Edit project details modal ── */
function openEditProjectModal(projectId) {
  const p = state.workspaceData.projects.find(x => x.projectId === projectId);
  if (!p) return;
  const isAdmin = state.user.role === 'Admin';
  openModal(`
    <div class="modal-header"><h2>Edit Project Details</h2><button class="modal-close" id="_mc">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Project Name</label><input id="epName" value="${escapeAttr(p.projectName)}"></div>
      <div class="field"><label>Objective *</label><textarea id="epDesc" required>${escapeHtml(p.description||'')}</textarea></div>
      <div class="field"><label>Scope *</label><input id="epImpact" value="${escapeAttr(p.impact||'')}" required></div>
      <div class="field"><label>Priority</label><select id="epPriority">${PRIORITIES.map(pr=>`<option value="${pr}"${p.priority===pr?' selected':''}>${pr}</option>`).join('')}</select></div>
      <div class="field"><label>Dependency</label><input id="epDependency" value="${escapeAttr(p.dependency||'')}"></div>
      <div class="field"><label>Stakeholders</label><input id="epStakeholders" value="${escapeAttr(p.stakeholders||'')}" placeholder="e.g. Ops team, Finance (optional)"></div>
      ${p.status==='Completed' ? `<div class="field"><label>Actual Completion Date</label><input type="date" id="epCompletionDate" value="${formatDateInput(p.actualCompletionDate)}">
        <p style="font-size:12px;color:var(--ink-faint);margin-top:6px;">Auto-filled when marked Completed — only change if it needs correcting.</p></div>` : ''}
      <div class="field"><label>ETD (Deadline)</label>
        ${isAdmin
          ? `<input type="date" id="epEta" value="${formatDateInput(p.eta)}">`
          : `<input value="${formatDateDisplay(p.eta)}" disabled style="opacity:.6;cursor:not-allowed;">
             <p style="font-size:12px;color:var(--ink-faint);margin-top:6px;">🔒 Only Admin can change the deadline.</p>`}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="_mcancel">Cancel</button>
      <button class="btn btn-primary" id="_msave">Save Changes</button>
    </div>
  `);
  $('_mc').onclick = $('_mcancel').onclick = closeModal;
  $('_msave').onclick = () => submitEditProject(projectId);
}

async function submitEditProject(projectId) {
  const updates = {
    projectName: val('epName'), description: val('epDesc'), impact: val('epImpact'),
    priority: val('epPriority'), dependency: val('epDependency'), stakeholders: val('epStakeholders')
  };
  const ced = $('epCompletionDate'); if (ced) updates.actualCompletionDate = ced.value;
  if (state.user.role === 'Admin') { const eta = $('epEta'); if (eta) updates.eta = eta.value; }
  if (!updates.projectName) { showToast('⚠️ Project name is required'); return; }
  if (!updates.description) { showToast('⚠️ Objective is required'); return; }
  if (!updates.impact)      { showToast('⚠️ Scope is required'); return; }
  const res = await apiCall('updateProject', { projectId, updates });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  closeModal(); showToast('✓ Project details updated');
  patchLocalProject(res.data.project);
}

/* ── Check-in ── */
function onCheckinToggle(projectId, checkbox) {
  const project = state.workspaceData.projects.find(p => p.projectId === projectId);
  if (!project.loggedToday) {
    openCheckinModal(projectId, '', '');
  } else {
    if (!confirm("Remove today's check-in for this project?")) return;
    removeCheckin(projectId);
  }
}

function openProjectCheckinEdit(projectId) {
  const proj = state.workspaceData?.projects.find(p => p.projectId === projectId);
  openCheckinModal(projectId, proj?.todaysLogType || '', proj?.todaysLogDescription || '');
}

function openCheckinModal(projectId, existingType, existingText) {
  openModal(`
    <div class="modal-header"><h2>Log today's update</h2><button class="modal-close" id="_mc">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>What kind of update? *</label>
        <select id="checkinType">
          <option value="">Select…</option>
          ${UPDATE_TYPES.map(t=>`<option value="${t}"${existingType===t?' selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div id="checkinReasonWrap" class="field${existingType ? '' : ' hidden'}">
        <label>Reason *</label>
        <textarea id="checkinDesc" placeholder="What happened? This is required.">${escapeHtml(existingText||'')}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="_mcancel">Cancel</button>
      <button class="btn btn-primary" id="_msave">${existingText ? 'Save changes' : 'Log it'}</button>
    </div>
  `);
  $('_mc').onclick = $('_mcancel').onclick = closeModal;
  $('_msave').onclick = () => submitCheckin(projectId);
  $('checkinType').onchange = () => setHidden('checkinReasonWrap', !$('checkinType').value);
}

async function submitCheckin(projectId) {
  const updateType  = val('checkinType');
  const description = val('checkinDesc');
  if (!updateType)   { showToast('⚠️ Select what kind of update this is'); return; }
  if (!description)  { showToast('⚠️ A reason is required'); return; }
  if (isJunkDescription(description)) { showToast('⚠️ Please describe what actually happened'); return; }
  const res = await apiCall('logDailyWork', { projectId, updateType, description });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  closeModal(); showToast('✓ Logged — thanks for keeping this updated');
  patchLocalProject({ projectId, loggedToday:true, todaysLogType:updateType, todaysLogDescription:description });
}

async function removeCheckin(projectId) {
  const res = await apiCall('deleteDailyWork', { projectId });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  showToast('✓ Removed');
  patchLocalProject({ projectId, loggedToday:false, todaysLogType:'', todaysLogDescription:'' });
}

/* Patch one project in local state & re-render just the tab content */
function patchLocalProject(updated) {
  if (!state.workspaceData) return;
  const idx = state.workspaceData.projects.findIndex(p => p.projectId === updated.projectId);
  if (idx !== -1) state.workspaceData.projects[idx] = { ...state.workspaceData.projects[idx], ...updated };
  renderWorkspaceTabContent();
}

async function updateProjectField(projectId, field, value) {
  const res = await apiCall('updateProject', { projectId, updates: { [field]: value } });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  showToast('✓ Saved');
  patchLocalProject(res.data.project);
}

/* Project log page */
const UPDATE_TYPE_COLORS = { 'Update Progress':'pill-green','Update Delay':'pill-red','Update Deprioritization':'pill-amber' };

async function openProjectLogPage(projectId) {
  const project = state.workspaceData?.projects.find(p => p.projectId === projectId);
  setHTML('mainContainer', `
    <button class="back-link" id="logBackBtn">← Back to ${state.workspaceData ? escapeHtml(state.workspaceData.user.name) : 'workspace'}'s Workspace</button>
    <div class="section-title">📜 ${project ? escapeHtml(project.projectName) : 'Project'} — Log History</div>
    <div id="projectLogPageBody" style="padding:40px;text-align:center;color:var(--ink-faint);">Loading…</div>
  `);
  $('logBackBtn').onclick = renderWorkspace;

  const res = await apiCall('getProjectLogs', { projectId });
  const body = $('projectLogPageBody');
  if (!body) return;
  if (!res.ok) { body.outerHTML = `<div class="empty-state">⚠️ ${escapeHtml(res.error)}</div>`; return; }
  const { logs } = res.data;
  if (!logs.length) { body.outerHTML = '<div class="empty-state">No updates logged yet.</div>'; return; }
  body.outerHTML = `<div class="card-list">${logs.map(l => `
    <div class="item-card">
      <div class="item-card-top" style="margin-bottom:4px;">
        <span class="pill ${UPDATE_TYPE_COLORS[l.type]||'pill-neutral'}">${escapeHtml(l.type||'')}</span>
        <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);">${formatDateDisplay(l.date)}${l.isToday?' · Today':''}</span>
      </div>
      <div style="font-size:13.5px;color:var(--ink-soft);">${escapeHtml(l.description)}</div>
      ${l.isToday ? `<button class="link-btn" style="font-size:12px;margin-top:8px;" onclick="openProjectCheckinEdit('${projectId}')">Edit today's entry</button>` : ''}
    </div>`).join('')}</div>`;
}

/* ── Idea / Adhoc / History cards ── */
function renderIdeaCard(i) {
  return `<div class="item-card">
    <div class="item-card-top">
      <div class="item-title">${escapeHtml(i.description)}</div>
      <span class="pill pill-neutral">${escapeHtml(i.type)}</span>
    </div>
    ${i.expectedImpact ? `<div class="item-desc"><b>Expected impact:</b> ${escapeHtml(i.expectedImpact)}</div>` : ''}
  </div>`;
}

function renderAdhocCard(a) {
  return `<div class="item-card">
    <div class="item-card-top">
      <div class="item-title">${escapeHtml(a.task)}</div>
      <span class="pill pill-neutral">${a.timeSpent}h</span>
    </div>
    <div class="item-desc">${escapeHtml(a.description||'')}</div>
    <div class="meta-row">
      ${a.source ? `<div class="meta-item">Source: <b>${escapeHtml(a.source)}</b></div>` : ''}
      <div class="meta-item">Date: <b>${formatDateDisplay(a.date)}</b></div>
    </div>
  </div>`;
}

function renderHistoryItem(h) {
  return `<div class="item-card" style="padding:14px 18px;">
    <div style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);margin-bottom:4px;">${formatDateTimeDisplay(h['Timestamp'])}</div>
    <div style="font-size:13.5px;"><b>${escapeHtml(h['Module'])}</b> — ${escapeHtml(h['Action'])}${h['Field Changed']?' · '+escapeHtml(h['Field Changed']):''}</div>
    ${h['Field Changed'] ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">${escapeHtml(String(h['Old Value']||'—'))} → ${escapeHtml(String(h['New Value']||'—'))}</div>` : ''}
  </div>`;
}

/* ============================================================
   ADD MODALS
   ============================================================ */
function openProjectModal() {
  openModal(`
    <div class="modal-header"><h2>📁 Add Project</h2><button class="modal-close" id="_mc">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Project Name</label><input id="pmName" placeholder="e.g. 3PL Cost Optimisation"></div>
      <div class="field"><label>Objective *</label><textarea id="pmDesc" placeholder="What is this project meant to achieve?" required></textarea></div>
      <div class="field"><label>Status</label>
        <select id="pmStatus">${PROJECT_STATUSES.filter(s=>s!=='Delayed').map(s=>`<option value="${s}">${s==='Open'?'Open / To Be Picked':s}</option>`).join('')}</select>
      </div>
      <div class="field"><label>ETD</label><input type="date" id="pmEta"></div>
      <div class="field"><label>Scope *</label><input id="pmImpact" placeholder="e.g. What's in/out of scope" required></div>
      <div class="field"><label>Priority</label><select id="pmPriority">${PRIORITIES.map(p=>`<option value="${p}">${p}</option>`).join('')}</select></div>
      <div class="field"><label>Dependency</label><input id="pmDependency" placeholder="Optional"></div>
      <div class="field"><label>Stakeholders</label><input id="pmStakeholders" placeholder="e.g. Ops team, Finance (optional)"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="_mcancel">Cancel</button>
      <button class="btn btn-primary" id="_msave">Add Project</button>
    </div>
  `);
  $('_mc').onclick = $('_mcancel').onclick = closeModal;
  $('_msave').onclick = submitProjectModal;
}

async function submitProjectModal() {
  const project = {
    projectName: val('pmName'), description: val('pmDesc'), status: val('pmStatus'),
    eta: val('pmEta'), impact: val('pmImpact'), priority: val('pmPriority'),
    dependency: val('pmDependency'), stakeholders: val('pmStakeholders')
  };
  if (!project.projectName || !project.eta) { showToast('⚠️ Name and ETD are required'); return; }
  if (!project.description) { showToast('⚠️ Objective is required'); return; }
  if (!project.impact)      { showToast('⚠️ Scope is required'); return; }
  const res = await apiCall('createProject', { project });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  closeModal(); showToast('✓ Project added — nice work');
  if (state.workspaceData) { state.workspaceData.projects.push(res.data.project); renderWorkspace(); }
}

function openIdeaModal() {

    <div class="modal-body">
      <div class="field"><label>Type</label><select id="imType">${IDEA_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
      <div class="field"><label>Description</label><textarea id="imDesc" placeholder="What's the idea?"></textarea></div>

      <div class="field"><label>Source</label><input id="amSource" placeholder="e.g. Manager request"></div>

async function submitAdhocModal() {

/* ============================================================
   ADMIN: TEAM MANAGEMENT
   ============================================================ */
async function openTeamManagement() {
  renderLoading();
  const res = await apiCall('getAllUsers');
  if (!res.ok) { renderError(res.error); return; }
  renderTeamManagement(res.data.users);
}

function renderTeamManagement(users) {
  const rows = users.map(u => `
    <tr>
      <td style="font-family:var(--font-body);font-size:18px;">${u.avatar}</td>
      <td class="name-cell">${escapeHtml(u.name)}</td>
      <td style="font-family:var(--font-body);">${escapeHtml(u.email)}</td>
      <td><span class="role-badge role-${u.role}">${u.role}</span></td>
      <td class="status-${u.status}" style="font-family:var(--font-body);">${u.status}</td>
      <td style="display:flex;gap:6px;">
        <button class="btn btn-ghost btn-sm" data-tm-edit="${u.userId}|${escapeAttr(u.name)}|${escapeAttr(u.email)}|${u.avatar}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-tm-resetpw="${u.userId}|${escapeAttr(u.email)}">Reset PW</button>
        ${u.status==='Active'
          ? `<button class="btn btn-danger btn-sm" data-tm-deactivate="${u.userId}">Deactivate</button>`
          : `<button class="btn btn-primary btn-sm" data-tm-reactivate="${u.userId}">Reactivate</button>`}
      </td>
    </tr>`).join('');

  setHTML('mainContainer', `
    <button class="back-link" id="tmBackBtn">← Back to Cumin</button>
    <div class="section-title">👑 Team Management
      <button class="btn btn-warm btn-sm" id="addUserBtn">+ Add Team Member</button>
    </div>
    <div class="mgmt-table-wrap"><table>
      <thead><tr><th></th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  `);
  $('tmBackBtn').onclick = goHome;
  $('addUserBtn').onclick = openAddUserModal;

  // Delegate all table action buttons
  $('mainContainer').querySelector('tbody').onclick = e => {
    const btn = e.target.closest('button[data-tm-edit],button[data-tm-resetpw],button[data-tm-deactivate],button[data-tm-reactivate]');
    if (!btn) return;
    if (btn.dataset.tmEdit) {
      const [uid, name, email, avatar] = btn.dataset.tmEdit.split('|');
      openEditUserModal(uid, name, email, avatar);
    } else if (btn.dataset.tmResetpw) {
      const [uid, email] = btn.dataset.tmResetpw.split('|');
      adminResetPw(uid, email);
    } else if (btn.dataset.tmDeactivate) {
      deactivateUser(btn.dataset.tmDeactivate);
    } else if (btn.dataset.tmReactivate) {
      reactivateUser(btn.dataset.tmReactivate);
    }
  };
}

function openAddUserModal() {
  const avatarOptions = Object.keys(AVATAR_COLORS).map(a=>`<option value="${a}">${a}</option>`).join('');
  openModal(`
    <div class="modal-header"><h2>Add Team Member</h2><button class="modal-close" id="_mc">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input id="auName" placeholder="Full name"></div>
      <div class="field"><label>Work Email</label><input type="email" id="auEmail" placeholder="name@company.com"></div>
      <div class="field"><label>Avatar</label><select id="auAvatar">${avatarOptions}</select></div>
      <p style="font-size:12.5px;color:var(--ink-soft);">A random 6-digit password will be generated and emailed automatically.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="_mcancel">Cancel</button>
      <button class="btn btn-primary" id="_msave">Create User</button>
    </div>
  `);
  $('_mc').onclick = $('_mcancel').onclick = closeModal;
  $('_msave').onclick = submitAddUser;
}
async function submitAddUser() {
  const user = { name:val('auName'), email:val('auEmail'), avatar:val('auAvatar') };
  if (!user.name || !user.email) { showToast('⚠️ Name and email required'); return; }
  const res = await apiCall('addUser', { user });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  closeModal(); showToast("✓ Welcome email sent — they're all set");
  openTeamManagement();
}

function openEditUserModal(userId, name, email, avatar) {
  const avatarOptions = Object.keys(AVATAR_COLORS).map(a=>`<option value="${a}"${a===avatar?' selected':''}>${a}</option>`).join('');
  openModal(`
    <div class="modal-header"><h2>Edit ${escapeHtml(name)}</h2><button class="modal-close" id="_mc">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input id="euName" value="${escapeAttr(name)}"></div>
      <div class="field"><label>Work Email</label><input id="euEmail" value="${escapeAttr(email)}"></div>
      <div class="field"><label>Avatar</label><select id="euAvatar">${avatarOptions}</select></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="_mcancel">Cancel</button>
      <button class="btn btn-primary" id="_msave">Save Changes</button>
    </div>
  `);
  $('_mc').onclick = $('_mcancel').onclick = closeModal;
  $('_msave').onclick = () => submitEditUser(userId);
}
async function submitEditUser(userId) {
  const updates = { name:val('euName'), email:val('euEmail'), avatar:val('euAvatar') };
  const res = await apiCall('updateUser', { userId, updates });
  if (!res.ok) { showToast('⚠️ ' + res.error); return; }
  closeModal(); showToast('✓ Updated');
  openTeamManagement();
}

async function deactivateUser(userId) {
  if (!confirm('Deactivate this user? History stays intact and they can be reactivated later.')) return;
  const res = await apiCall('deactivateUser', { userId });
  showToast(res.ok ? '✓ Deactivated' : '⚠️ ' + res.error);
  openTeamManagement();
}
async function reactivateUser(userId) {
  const res = await apiCall('reactivateUser', { userId });
  showToast(res.ok ? '✓ Reactivated' : '⚠️ ' + res.error);
  openTeamManagement();
}
async function adminResetPw(userId, email) {
  if (!confirm('Send a new password to ' + email + '?')) return;
  const res = await apiCall('adminResetPassword', { userId });
  showToast(res.ok ? '✓ New password emailed' : '⚠️ ' + res.error);
}

/* ============================================================
   MISC UTILS
   ============================================================ */
function togglePasswordVisibility(inputId, btn) {
  const input = $(inputId);
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  btn.textContent = hidden ? '🙈' : '👁';
  btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
}
</script>
